name: Native Apple matrix

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: stable
      - name: Analyze, test, and build Flutter iOS fixture
        working-directory: fixtures/flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build ios --simulator --no-codesign

  swiftui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest installed Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Build and test SwiftUI Token Gallery
        working-directory: fixtures/swiftui
        run: |
          for attempt in 1 2 3; do
            DEVICE_ID=$(xcrun simctl list devices available --json \
              | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for rt in sorted(d, reverse=True) for x in d[rt] if "iPhone" in x["name"]]; print(ids[0] if ids else "")')
            if [ -z "$DEVICE_ID" ]; then
              echo "Attempt $attempt: no available iPhone simulator yet; waiting for CoreSimulator..."
              sleep 15
              continue
            fi
            echo "Attempt $attempt: testing on simulator $DEVICE_ID"
            if xcodebuild test \
              -project TokenGallery.xcodeproj \
              -scheme TokenGallery \
              -destination "platform=iOS Simulator,id=$DEVICE_ID"; then
              exit 0
            fi
            echo "Attempt $attempt failed; retrying..."
            sleep 15
          done
          echo "SwiftUI tests failed after retries" >&2
          exit 1

  react-native-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: fixtures/react-native/package.json
      - name: Install JavaScript dependencies and native pods
        working-directory: fixtures/react-native
        run: |
          npm install
          bundle install
          bundle exec pod install --project-directory=ios
      - name: Build iOS debug application
        working-directory: fixtures/react-native
        run: xcodebuild -workspace ios/TokenGallery.xcworkspace -scheme TokenGallery -configuration Debug -sdk iphonesimulator build
