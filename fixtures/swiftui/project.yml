name: TokenGallery
options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
targets:
  TokenGallery:
    type: application
    platform: iOS
    sources:
      - TokenGallery/Sources
    info:
      path: TokenGallery/Info.plist
      properties:
        CFBundleDisplayName: Token Gallery
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobiletokens.gallery
        PRODUCT_NAME: TokenGallery
        GENERATE_INFOPLIST_FILE: NO
  TokenGalleryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - TokenGallery/Tests
    dependencies:
      - target: TokenGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mobiletokens.gallery.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TokenGallery:
    build:
      targets:
        TokenGallery: all
        TokenGalleryTests: [test]
    test:
      targets:
        - TokenGalleryTests
